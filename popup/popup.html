<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wayback Machine Settings</title>
    <link rel="stylesheet" href="./popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <!-- A simple SVG icon for a modern look -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z" />
            </svg>
            <h1>Wayback Machine AI Settings</h1>
        </div>

        <p class="description">Select your default language for translations.</p>

        <div class="setting">
            <label for="language-select">Target Language:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ja">Japanese</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="it">Italian</option>
            </select>
        </div>

        <button id="save-button">Save Settings</button>
        <div id="status-message" role="status" aria-live="polite"></div>
    </div>

    <script src="./popup.js"></script>
</body>

</html>
